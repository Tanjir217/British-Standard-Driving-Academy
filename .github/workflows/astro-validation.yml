name: Astro validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [astro-wix-backend-foundation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect Wix integration peer requirements
        run: |
          npm view @wix/astro@2.75.2 peerDependencies --json
          npm view @wix/astro-pages@2.0.8 peerDependencies --json
          npm view @wix/cloud-provider-fetch-adapter@1.0.5 peerDependencies --json
          npm view @astrojs/react@4.3.0 peerDependencies --json
          npm view @astrojs/check@0.9.4 peerDependencies --json
          npm view @wix/cli@1.1.258 version --json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Astro type check
        run: npm run check
      - name: Astro production build
        run: npm run build:astro
