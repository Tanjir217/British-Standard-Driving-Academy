name: Astro validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [astro-wix-backend-foundation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # A placeholder only for build-time integration initialization. It is not
    # a production credential and is never used for Wix API requests.
    env:
      WIX_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate dependencies from package.json for validation
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Report installed integration versions
        run: npm ls astro @wix/astro @wix/astro-pages @astrojs/react @wix/cloud-provider-fetch-adapter
      - name: Astro type check
        run: npm run check
      - name: Astro production build
        run: npm run build:astro
