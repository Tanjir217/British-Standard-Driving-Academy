name: Astro validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [astro-wix-backend-foundation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Astro type check
        run: npm run check
      - name: Astro production build
        run: npm run build:astro
